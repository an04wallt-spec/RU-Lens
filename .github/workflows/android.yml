name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RU_LENS_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/RU-LENS-release.jks"

      - name: Build signed release APK
        env:
          RU_LENS_KEYSTORE_PATH: ${{ runner.temp }}/RU-LENS-release.jks
          RU_LENS_STORE_PASSWORD: ${{ secrets.RU_LENS_STORE_PASSWORD }}
          RU_LENS_KEY_PASSWORD: ${{ secrets.RU_LENS_KEY_PASSWORD }}
          RU_LENS_KEY_ALIAS: ${{ secrets.RU_LENS_KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RU-LENS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RU-LENS
          path: RU-LENS.apk
